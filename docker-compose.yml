# 使い方 (詳細は docs/docker.md):
#   1. モデル取得 (初回のみ):
#        docker compose --profile setup run --rm model-fetch
#   2. 起動 (CPU環境):
#        docker compose --profile cpu up -d
#      起動 (NVIDIA GPU環境、要 nvidia-container-toolkit):
#        docker compose --profile cuda up -d
#
# PHOTO_LIBRARY_PATH は .env ファイルか環境変数で指定 (例: PHOTO_LIBRARY_PATH=/home/you/Pictures)。
# UIの「フォルダを追加」にはコンテナ内パス /photos/... を登録すること (ホスト側パスではない)。

# プロジェクト名とボリューム実名はフォルダ名に依存させない。
# ボリュームは下の name: で okudana_data / okudana_models に固定する。
# 0.4.x の実ボリューム名は photofinder_photofinder_data /
# photofinder_photofinder_models。移し方は docs/docker.md。
# コンテナには OKUDANA_* を渡す。アプリは未設定時だけ旧 PHOTOFINDER_* を読む。
# データディレクトリの photofinder.db は起動時に okudana.db へ改名する。
name: okudana

services:
  okudana-cpu:
    build:
      context: .
      target: runtime
      args:
        VARIANT: cpu
    image: okudana:cpu
    profiles: ["cpu"]
    # スキャン中(ML推論込み)にホストの全コアを使い切らないようcgroups側で制限する
    deploy:
      resources:
        limits:
          cpus: "2"
    # ポートマッピングが公開範囲そのもの (アプリ側に認証機構は無い)。
    # 127.0.0.1 のままなら、このDockerホスト以外からは一切アクセスできない。
    # LAN/インターネットに公開したい場合のみ、左側を 0.0.0.0 (または省略) に
    # 変更すること — その場合の安全確保は利用者の責任 (README/docs/docker.md参照)
    ports:
      - "127.0.0.1:8686:8686"
    environment:
      OKUDANA_DATA: /app/data
      OKUDANA_HOST: 0.0.0.0   # コンテナ内で全interface待受 (実際の公開範囲は上のports:が決める)
      OKUDANA_PORT: "8686"
    volumes:
      - okudana_data:/app/data
      - okudana_models:/app/models
      - ${PHOTO_LIBRARY_PATH:?Set PHOTO_LIBRARY_PATH (e.g. in a .env file) to your photo library path}:/photos:ro
    restart: unless-stopped

  okudana-cuda:
    build:
      context: .
      target: runtime
      args:
        VARIANT: cuda
    image: okudana:cuda
    profiles: ["cuda"]
    # cpus: okudana-cpuサービスと同じ理由。GPU推論を使っても、EXIF/走査/
    # サムネ生成やOCRはCPU側で動くため無関係ではない
    deploy:
      resources:
        limits:
          cpus: "2"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    ports:
      - "127.0.0.1:8686:8686"
    environment:
      OKUDANA_DATA: /app/data
      OKUDANA_HOST: 0.0.0.0
      OKUDANA_PORT: "8686"
    volumes:
      - okudana_data:/app/data
      - okudana_models:/app/models
      - ${PHOTO_LIBRARY_PATH:?Set PHOTO_LIBRARY_PATH (e.g. in a .env file) to your photo library path}:/photos:ro
    restart: unless-stopped

  # 初回セットアップ用。モデル取得はアプリイメージのビルド/起動ライフサイクル
  # から独立させてある (Dockerfileのmodel-fetchステージ参照)。実行後は
  # コンテナ自体は破棄してよい (--rm)、成果物はmodelsボリューム側に残る
  model-fetch:
    build:
      context: .
      target: model-fetch
    image: okudana:model-fetch
    profiles: ["setup"]
    volumes:
      - okudana_models:/app/models

volumes:
  okudana_data:
    name: okudana_data
  okudana_models:
    name: okudana_models
